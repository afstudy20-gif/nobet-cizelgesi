# Serves the Next.js static export (apps/web/out).
# The app is local-first: there is no upstream server, API or database.
server {
    listen 3100;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This host has no PHP and never will. Backdoor scanners hit it constantly;
    # 444 closes the connection without a response, so they get zero bytes
    # instead of a 17 KB not-found page. Humans never type these paths.
    location ~ \.php$ {
        return 444;
    }

    # Hashed build assets are immutable — cache them forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # 1. exact file, 2. directory index, 3. the exported "<route>.html".
        #
        # No index.html fallback: a static export writes a real file for every
        # route, and the one client-routed detail view is a query parameter
        # (/people?id=), which does not change the path. Falling back would
        # answer 200 to every path that does not exist — which is exactly what
        # the PHP-backdoor scanners hitting this host were being told.
        try_files $uri $uri/ $uri.html =404;
    }

    # Next's exported not-found page, so a mistyped URL still looks like the app.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
