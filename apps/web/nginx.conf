# Serves the Next.js static export (apps/web/out).
# The app is local-first: there is no upstream server, API or database.
server {
    listen 3100;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable — cache them forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # 1. exact file, 2. directory index, 3. the exported "<route>.html",
        # 4. fall back to index.html so client-side routing works on
        #    refresh / deep links.
        try_files $uri $uri/ $uri.html /index.html;
    }
}
