# One service: the static web build served by nginx.
# No database, no volumes, no secrets — all data lives in the browser
# (IndexedDB) and syncs to the user's own Google Drive.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # No container_name on purpose. A fixed name means the next deploy tries to
    # create a container whose name the running one still holds, which fails
    # immediately with a name conflict — the deploy platform has to be free to
    # name containers itself so it can start the new one before retiring the old.
    ports:
      # Host port 3100 keeps existing deploy config working; nginx serves on 3100.
      - "3100:3100"
    restart: unless-stopped
