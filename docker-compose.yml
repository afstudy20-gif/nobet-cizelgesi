# One service: the static web build served by nginx.
# No database, no volumes, no secrets — all data lives in the browser
# (IndexedDB) and syncs to the user's own Google Drive.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nobet-web
    ports:
      # Host port 3100 keeps existing deploy config working; nginx serves on 80.
      - "3100:80"
    restart: unless-stopped
